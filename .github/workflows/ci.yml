name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, cheap feedback: the shared logic (document model, fitting, provenance,
  # guardrails, model catalogue) is Foundation-only and tests on Linux.
  core-tests-linux:
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Test WriterKit
        run: swift test --package-path Packages/WriterKit

  # Full iOS build on a Mac with Xcode 27. No signing: this only proves the
  # app compiles and the package tests pass on Apple platforms.
  ios-build:
    runs-on: xcode-27
    env:
      APPLE_TEAM_ID: ""
      BUNDLE_ID: com.tecn01r.worldeditor
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Decides what this push needs: screenshots only for UI changes, the
      # Focus edge-case shots only for Focus changes, and the xtool layout
      # check only when the package manifest or the file list changes.
      - name: What changed?
        id: ui
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || ! git cat-file -e "$before" 2>/dev/null; then
            printf 'changed=true\nfocus=true\nlayout=true\n' >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$before" "${{ github.sha }}")
          added=$(git diff --name-only --diff-filter=ADR "$before" "${{ github.sha }}")
          has() { grep -qE "$1" && echo true || echo false; }
          echo "changed=$(echo "$files" | has '^(App/|ci/|project\.yml|Package\.swift|Packages/WriterKit/Sources/FocusLayout/)')" >> "$GITHUB_OUTPUT"
          echo "focus=$(echo "$files" | has '(Focus|TextKitMeasurer|ci/screenshots)')" >> "$GITHUB_OUTPUT"
          echo "layout=$( (echo "$files" | grep -E '^(Package\.swift|xtool\.yml)$'; echo "$added" | grep '\.swift$') | has . )" >> "$GITHUB_OUTPUT"
      # The cold Duo boot (~1–2 min) is the slowest thing in the job, so it
      # starts first. The builds use -sdk rather than -destination so that
      # xcodebuild doesn't wait on the booting simulator.
      - name: Start booting the Duo simulator
        if: steps.ui.outputs.changed == 'true'
        run: |
          python3 ci/pick_devices.py > devices.txt
          while IFS='|' read -r UDID NAME; do xcrun simctl boot "$UDID" & done < devices.txt
      - name: Check the xtool package layout builds (same sources xtool builds on Linux)
        if: steps.ui.outputs.layout == 'true'
        run: |
          set -o pipefail
          xcodebuild build -scheme WorldEditor \
            -sdk iphonesimulator \
            -derivedDataPath build-spm ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO | tail -5
      - name: Restore XcodeGen
        id: xcodegen
        uses: actions/cache@v4
        with:
          path: /tmp/xcodegen
          key: xcodegen-1
      - name: Install XcodeGen (prebuilt binary, only on a cache miss)
        if: steps.xcodegen.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip" -o /tmp/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
      - run: echo "/tmp/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate project
        run: xcodegen generate
      - name: Build app for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project WorldEditor.xcodeproj -scheme WorldEditor \
            -sdk iphonesimulator \
            -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO > build.log || { tail -40 build.log; exit 1; }
          tail -3 build.log
      - name: Screenshots in the simulator
        if: steps.ui.outputs.changed == 'true'
        env:
          FULL_SHOTS: ${{ steps.ui.outputs.focus }}
        run: ci/screenshots.sh
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: build.log

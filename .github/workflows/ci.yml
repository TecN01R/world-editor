name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, cheap feedback: the shared logic (document model, fitting, provenance,
  # guardrails, model catalogue) is Foundation-only and tests on Linux.
  core-tests-linux:
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Test WriterKit
        run: swift test --package-path Packages/WriterKit

  # Full iOS build on a Mac with Xcode 27. No signing: this only proves the
  # app compiles and the package tests pass on Apple platforms.
  ios-build:
    runs-on: xcode-27
    env:
      APPLE_TEAM_ID: ""
      BUNDLE_ID: com.tecn01r.worldeditor
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did UI code change?
        id: ui
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || ! git cat-file -e "$before" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$before" "${{ github.sha }}" | grep -qE '^(App/|ci/|project\.yml|Package\.swift|Packages/WriterKit/Sources/FocusLayout/)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "No UI changes: skipping screenshots."
          fi
      - name: Tool versions
        run: xcodebuild -version && swift --version
      - name: Build the xtool package for iOS (same sources xtool builds on Linux)
        run: |
          set -o pipefail
          xcodebuild build -scheme WorldEditor \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-spm ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO | tail -5
      - name: Start booting the Duo simulator (runs while we compile)
        if: steps.ui.outputs.changed == 'true'
        run: |
          python3 ci/pick_devices.py > devices.txt
          while IFS='|' read -r UDID NAME; do xcrun simctl boot "$UDID" & done < devices.txt
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Test WriterKit on macOS
        run: swift test --package-path Packages/WriterKit
      - name: Build app for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project WorldEditor.xcodeproj -scheme WorldEditor \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO | tee build.log
      - name: Screenshots in the simulator
        if: steps.ui.outputs.changed == 'true'
        run: ci/screenshots.sh
      - name: Upload screenshots
        if: always() && steps.ui.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 1   # temporary: reviewed in chat, never committed
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: build.log
